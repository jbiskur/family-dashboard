name: Verify Heima
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:setup
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Launch real local runtime
        run: |
          HEIMA_WEB_MODE=production bun scripts/test-runtime.ts > /tmp/heima-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3010/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/heima-runtime.log
          exit 1
      - run: bun test tests/http
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heima-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
