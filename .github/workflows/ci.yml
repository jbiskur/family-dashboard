name: Verify Heima
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-shard:
    name: verify (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
        shard: [1, 2, 3]
        shards: [3]
    runs-on: ubuntu-latest
    # Keep each serial shard below the ten-minute feedback target while
    # retaining every test in every browser project.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:setup
      - name: Install project browser
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: |
          browser_engine="$BROWSER_PROJECT"
          if [ "$browser_engine" = mobile ]; then browser_engine=chromium; fi
          # HTTP session-custody checks use Chromium on every runner.
          if [ "$browser_engine" = chromium ]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install --with-deps chromium "$browser_engine"
          fi
      - name: Launch real local runtime
        run: |
          HEIMA_WEB_MODE=production bun scripts/test-runtime.ts > /tmp/heima-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3010/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/heima-runtime.log
          exit 1
      - name: Bootstrap isolated test household
        run: bun scripts/test-bootstrap.ts
      - name: Seed browser evidence household
        run: bun scripts/screenshot-fixture.ts
      - name: Probe independent WebKit offline navigation
        if: matrix.project == 'webkit'
        run: node tests/manual/webkit-offline-control.mjs --report browser-capabilities/webkit-offline.json
      - name: Verify browser journeys
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          HEIMA_BROWSER_CAPABILITY_REPORT: ${{ github.workspace }}/browser-capabilities/webkit-offline.json
        run: bunx playwright test --project="$BROWSER_PROJECT" --shard="${{ matrix.shard }}/${{ matrix.shards }}" --grep-invert="independent UX audit|MCP|Reduced motion and 200-percent equivalent layout|Browser parses the installable named manifest|Heima installs and launches"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heima-browser-evidence-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            browser-capabilities/
          retention-days: 14
  # Browser state-heavy suites run on clean runners. This avoids carrying
  # service-worker, OAuth and reduced-motion state between unrelated journeys.
  verify-special:
    name: verify-special (${{ matrix.suite }}, ${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: audit
            spec: ux-audit
            grep: independent UX audit
            project: chromium
          - suite: audit
            spec: ux-audit
            grep: independent UX audit
            project: firefox
          - suite: audit
            spec: ux-audit
            grep: independent UX audit
            project: webkit
          - suite: audit
            spec: ux-audit
            grep: independent UX audit
            project: mobile
          - suite: mcp
            spec: mcp-tools
            grep: MCP
            project: chromium
          - suite: mcp
            spec: mcp-tools
            grep: MCP
            project: firefox
          - suite: mcp
            spec: mcp-tools
            grep: MCP
            project: webkit
          - suite: mcp
            spec: mcp-tools
            grep: MCP
            project: mobile
          - suite: shell
            spec: shell
            grep: .
            project: chromium
          - suite: shell
            spec: shell
            grep: .
            project: firefox
          - suite: shell
            spec: shell
            grep: .
            project: webkit
          - suite: shell
            spec: shell
            grep: .
            project: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:setup
      - name: Install project browser
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: |
          browser_engine="$BROWSER_PROJECT"
          if [ "$browser_engine" = mobile ]; then browser_engine=chromium; fi
          if [ "$browser_engine" = chromium ]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install --with-deps chromium "$browser_engine"
          fi
      - name: Launch real local runtime
        run: |
          HEIMA_WEB_MODE=production bun scripts/test-runtime.ts > /tmp/heima-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3010/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/heima-runtime.log
          exit 1
      - name: Bootstrap isolated test household
        run: bun scripts/test-bootstrap.ts
      - name: Run isolated browser suite
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          TEST_SPEC: tests/e2e/${{ matrix.spec }}.spec.ts
          TEST_GREP: ${{ matrix.grep }}
        run: bunx playwright test "$TEST_SPEC" --project="$BROWSER_PROJECT" --grep="$TEST_GREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heima-browser-evidence-${{ matrix.project }}-${{ matrix.suite }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  # HTTP coverage is shared by all browser projects. Running it once keeps the
  # browser shards focused on journeys and removes a two-minute duplicate from
  # every runner.
  http:
    name: http
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:setup
      - name: Install Chromium for HTTP notification coverage
        run: bunx playwright install --with-deps chromium
      - name: Launch real local runtime
        run: |
          HEIMA_WEB_MODE=production bun scripts/test-runtime.ts > /tmp/heima-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3010/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/heima-runtime.log
          exit 1
      - run: bun test tests/http
  # Keep the protected check names stable while the test work runs in parallel.
  # A matrix need resolves to failure when any shard fails, so every required
  # browser check remains a real gate rather than a decorative status.
  verify:
    name: verify (${{ matrix.project }})
    if: ${{ always() }}
    needs: [verify-shard, verify-special, http]
    strategy:
      matrix:
        project: [chromium, firefox, webkit, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all browser shards
        if: ${{ needs.verify-shard.result != 'success' || needs.verify-special.result != 'success' || needs.http.result != 'success' }}
        run: exit 1
      - run: echo "All ${{ matrix.project }} shards passed"
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: false
          load: ${{ matrix.app == 'web' }}
          tags: heima-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.app == 'web'
        with:
          bun-version: 1.3.10
      - name: Install host image decoder
        if: matrix.app == 'web'
        run: bun install --frozen-lockfile
      - name: Verify web image with a read-only filesystem
        if: matrix.app == 'web'
        run: node scripts/test-web-container.mjs heima-web:ci
      - uses: actions/upload-artifact@v4
        if: always() && matrix.app == 'web'
        with:
          name: heima-container-evidence-web
          path: test-results/container/
          retention-days: 14
