name: Publish containers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version or commit tag
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: true
          tags: ghcr.io/jbiskur/family-dashboard-${{ matrix.app }}:${{ inputs.tag || github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/jbiskur/family-dashboard
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag || github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
